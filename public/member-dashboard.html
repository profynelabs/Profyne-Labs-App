<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Dashboard - PROFYNE LABS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen">

    <div id="navbar-placeholder"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Profile Banner & Status -->
        <section
            class="bg-slate-800 border border-slate-700 rounded-xl p-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <img class="h-16 w-16 rounded-full border-2 border-indigo-500 object-cover"
                    src="/uploads/default-avatar.png" alt="Profile">
                <div>
                    <h2 class="text-lg font-bold text-white">স্বাগতম, শাকিল আহমেদ</h2>
                    <p class="text-xs text-indigo-400">Full Stack Developer | 📞 +8801800000000</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button
                    class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition">
                    <i class="fa-solid fa-play mr-1"></i> Check In
                </button>
                <button
                    class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition">
                    <i class="fa-solid fa-stop mr-1"></i> Check Out
                </button>
            </div>
        </section>

        <!-- Daily Worklog Form -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6">
            <h3 class="text-md font-bold text-white mb-4"><i
                    class="fa-solid fa-pen-to-square text-indigo-400 mr-2"></i>আজকের কাজের বিস্তারিত সাবমিট করুন</h3>
            <form class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">কাজের ক্যাটাগরি</label>
                        <input type="text" placeholder="যেমন: UI Design / API Integration"
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">ব্যয় হওয়া সময় (ঘণ্টা)</label>
                        <input type="number" step="0.5" placeholder="যেমন: 4.5"
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">কাজের বর্ণনা</label>
                    <textarea rows="3" placeholder="আজ কী কী কাজ সম্পাদন করেছেন সংক্ষেপে লিখুন..."
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"></textarea>
                </div>
                <button type="submit"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-5 py-2.5 rounded-lg transition">
                    সাবমিট করুন
                </button>
            </form>
        </section>

    </main>
</body>

</html>
